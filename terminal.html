<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8f3f1">
  <title>NPay Terminal</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="terminal">
    <header class="topbar rise">
      <div class="logo">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 20V4h3.6l6.8 9.6V4H19v16h-3.6L8.6 10.4V20z"/></svg></span>
        NPay Terminal
      </div>
      <a class="link-btn" href="./">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
        Wallet
      </a>
    </header>

    <div class="term-grid">
      <section class="panel rise d1">
        <h1 class="term-title">Take or give a payment</h1>
        <div class="segmented" id="seg" data-mode="pay" role="tablist">
          <span class="thumb"></span>
          <button id="modePay" class="on" role="tab" aria-selected="true">Charge</button>
          <button id="modeGet" role="tab" aria-selected="false">Give money</button>
        </div>
        <p class="mode-help" id="modeHelp">The phone that scans pays this amount.</p>

        <div class="field">
          <label for="amount">Amount</label>
          <div class="amount-wrap" id="amountWrap">
            <span class="cur">€</span>
            <input id="amount" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Amount in euro">
          </div>
        </div>
        <div class="quick">
          <button data-q="1">€1</button>
          <button data-q="5">€5</button>
          <button data-q="10">€10</button>
          <button data-q="20">€20</button>
        </div>
        <div class="field">
          <label for="note">Note <span style="font-weight:500">(optional)</span></label>
          <input class="input" id="note" maxlength="60" placeholder="e.g. Coffee" autocomplete="off">
        </div>
        <div class="field">
          <label for="who">Terminal name</label>
          <input class="input" id="who" maxlength="40" autocomplete="off">
        </div>
        <button class="btn primary block" id="makeBtn" style="margin-top:6px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
          Show QR code
        </button>
      </section>

      <section class="panel qr-stage rise d2" id="stage">
        <div class="stage-empty">
          <div class="ghost-qr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg></div>
          Enter an amount and press <b>Show QR code</b>.<br>Then scan it with the NPay wallet on your phone.
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="js/common.js"></script>
  <script src="js/terminal.js"></script>
</body>
</html>
